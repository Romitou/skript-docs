name: CI

# The scanner's tests, and the configuration a pull request may change (addons.json, deps.json,
# images.json). The extractor image is checked by images.yml.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["scanner/**", "addons.json", "deps.json", "extractor/images.json", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  scanner:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Check addons.json, deps.json and images.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run . validate --check-repos --addons ../addons.json --deps ../deps.json --images ../extractor/images.json
